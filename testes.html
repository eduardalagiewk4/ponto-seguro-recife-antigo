<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes do Ponto Seguro</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="logo/simbolo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilo.css">
  <style>
    .pagina { max-width: 1100px; }
    .tabela { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--borda); text-align: left; vertical-align: top; }
    th { color: var(--texto-suave); font-weight: 600; }
    tr.falhou td { background: rgba(248, 113, 113, .12); }
    #placar { font-size: 20px; font-weight: 700; color: var(--luz); }
  </style>
</head>
<body>
  <main class="pagina">
    <a class="marca" href="index.html"><img class="marca-simbolo" src="logo/simbolo.svg" alt="" width="32" height="32"><span>Ponto Seguro <span class="marca-local">Recife Antigo</span></span></a>
    <h1>Testes dos critérios de aceitação</h1>
    <p class="subtitulo">Cada linha roda a consulta com uma entrada fixa e compara o resultado esperado (definido na entrega 1) com o observado.</p>
    <p id="placar"></p>
    <div class="cartao tabela">
      <table>
        <thead>
          <tr><th>ID</th><th>Cenário</th><th>Entrada</th><th>Esperado</th><th>Observado</th><th>Resultado</th></tr>
        </thead>
        <tbody id="corpo-testes"></tbody>
      </table>
    </div>
    <p class="rodape"><a href="index.html">Voltar para a consulta</a></p>
  </main>

  <script src="dados.js"></script>
  <script src="janela.js"></script>
  <script src="horarios.js"></script>
  <script src="consulta.js"></script>
  <script src="testes.js"></script>
</body>
</html>
